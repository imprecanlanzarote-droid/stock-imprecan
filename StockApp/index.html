<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImpreCan Stock & Finanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .tab-active { background: #0f172a; color: white; font-weight: 600; }
        .tab-inactive { color: #64748b; font-weight: 500; }
        .tab-inactive:hover { background: #e2e8f0; }
        .btn-primary { background: #0f172a; color: white; padding: 0.5rem 1rem; border-radius: 0.75rem; font-weight: 600; transition: all 0.2s; }
        .btn-primary:hover { background: #1e293b; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.55; cursor: wait; transform: none; }
        .field { width: 100%; border: 1px solid #cbd5e1; padding: 0.75rem; border-radius: 0.75rem; font-weight: 700; color: #1e293b; background: white; }
        .field:focus { outline: none; border-color: #64748b; box-shadow: 0 0 0 3px rgba(100,116,139,0.12); }
        .field:read-only { background: #f1f5f9; color: #475569; }
        .icon-btn { width: 2rem; height: 2rem; display: inline-flex; align-items: center; justify-content: center; border-radius: 0.5rem; transition: all 0.15s; }
        .size-chip { border: 1px solid #cbd5e1; color: #475569; background: white; padding: 0.45rem 0.7rem; border-radius: 0.65rem; font-size: 0.7rem; font-weight: 800; transition: all 0.15s; }
        .size-chip:hover { border-color: #64748b; background: #f8fafc; }
        .size-chip-selected { background: #0f172a; border-color: #0f172a; color: white; }
        .size-chip-existing { background: #f1f5f9; border-color: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
        .transition-transform { transition: transform 0.2s ease; }
    </style>
</head>
<body class="pb-24">

<div id="loading" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
    <div class="w-10 h-10 border-4 border-slate-100 border-t-slate-800 rounded-full animate-spin"></div>
    <p id="loading-text" class="mt-4 font-semibold text-slate-500 text-sm">Sincronizando datos...</p>
</div>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[300] hidden max-w-[calc(100%-2rem)] rounded-xl px-4 py-3 text-sm font-bold shadow-xl"></div>

<div class="max-w-5xl mx-auto p-4 md:p-6">
    <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight">ImpreCan Business</h1>
            <p class="text-slate-500 text-sm mt-1">Control de inventario y rentabilidad</p>
        </div>
        <div class="flex flex-wrap gap-2">
            <button onclick="downloadBackup()" class="bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-50 text-slate-700 shadow-sm" title="Descargar una copia de todos los datos">
                <i class="fas fa-download mr-2 text-slate-400"></i>Copia
            </button>
            <button onclick="showModal('brand')" class="bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-50 text-slate-700 shadow-sm"><i class="fas fa-plus mr-2 text-slate-400"></i>Marca</button>
            <button onclick="showModal('garment')" class="bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-50 text-slate-700 shadow-sm"><i class="fas fa-plus mr-2 text-slate-400"></i>Tipo</button>
            <button onclick="showModal('model')" class="bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-50 text-slate-700 shadow-sm"><i class="fas fa-plus mr-2 text-slate-400"></i>Modelo</button>
            <button onclick="showModal('variant')" class="btn-primary text-xs shadow-md shadow-slate-200"><i class="fas fa-palette mr-2"></i>Color y tallas</button>
        </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
        <div class="card p-4">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Unidades Stock</p>
            <p id="stat-total" class="text-2xl font-black mt-1">0</p>
        </div>
        <div class="card p-4">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Inversión (Coste)</p>
            <p id="stat-investment" class="text-2xl font-black mt-1 text-slate-700">0€</p>
        </div>
        <div class="card p-4 bg-green-50 border-green-100">
            <p class="text-[10px] text-green-600 font-bold uppercase tracking-wider">Beneficio Estimado</p>
            <p id="stat-profit" class="text-2xl font-black mt-1 text-green-700">0€</p>
        </div>
        <div class="card p-4 bg-amber-50 border-amber-100">
            <p class="text-[10px] text-amber-600 font-bold uppercase tracking-wider">Bajo Stock</p>
            <p id="stat-low" class="text-2xl font-black mt-1 text-amber-700">0</p>
        </div>
    </div>

    <div class="bg-slate-100 p-1.5 rounded-2xl flex max-w-md mb-6">
        <button onclick="switchTab('stock')" id="tab-stock" class="flex-1 py-2.5 text-sm rounded-xl tab-active transition-all">Stock</button>
        <button onclick="switchTab('pending')" id="tab-pending" class="flex-1 py-2.5 text-sm rounded-xl tab-inactive transition-all">Por Pedir</button>
        <button onclick="switchTab('ordered')" id="tab-ordered" class="flex-1 py-2.5 text-sm rounded-xl tab-inactive transition-all">Ya Pedidos</button>
    </div>

    <div id="content-area" class="space-y-4"></div>
</div>

<div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-[200] p-4" onclick="closeModalFromOverlay(event)">
    <div class="bg-white w-full max-w-lg max-h-[92vh] overflow-y-auto p-5 md:p-6 rounded-2xl shadow-xl">
        <div class="flex justify-between items-center mb-5">
            <h3 id="modal-title" class="text-lg font-bold text-slate-800"></h3>
            <button onclick="closeModal()" class="icon-btn text-slate-400 hover:text-slate-700 hover:bg-slate-100" aria-label="Cerrar"><i class="fas fa-times"></i></button>
        </div>
        <div id="modal-body" class="space-y-4"></div>
        <p id="modal-message" class="hidden mt-4 rounded-xl px-3 py-2 text-xs font-semibold"></p>
        <div class="flex justify-end gap-3 mt-6">
            <button onclick="closeModal()" class="text-sm font-semibold text-slate-500 hover:text-slate-800 px-2">Cancelar</button>
            <button id="modal-btn" class="bg-slate-900 text-white text-sm px-6 py-2.5 rounded-xl font-bold hover:bg-slate-800 transition-colors">Guardar</button>
        </div>
    </div>
</div>

<script>
    // La estructura original de Firebase se mantiene intacta.
    // Cada talla sigue guardada en models/{modelo}/stock/{variante}.
    const firebaseConfig = {
        apiKey: "AIzaSyCiesjFpko52HogjrAHiFS7SMaSwSLfNuo",
        authDomain: "stock-imprecan.firebaseapp.com",
        databaseURL: "https://stock-imprecan-default-rtdb.firebaseio.com",
        projectId: "stock-imprecan",
        storageBucket: "stock-imprecan.appspot.com",
        messagingSenderId: "313112425492",
        appId: "1:313112425492:web:068c6a7f3bc10ec9d4a301"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let appData = {};
    let currentTab = 'stock';
    let expanded = { brands: {}, cats: {}, models: {}, colors: {} };
    let colorCache = {};
    let variantDraftSizes = [];
    let variantDraftSequence = 0;
    let toastTimer;

    const naturalCollator = new Intl.Collator('es', { numeric: true, sensitivity: 'base' });
    const commonSizes = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL'];
    const sizeRank = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', '2XL', '3XL', '4XL', '5XL'];

    db.ref('/').on('value', snap => {
        appData = snap.val() || {};
        document.getElementById('loading').classList.add('hidden');
        render();
        updateStats();
    }, error => {
        document.getElementById('loading-text').innerText = 'No se pudo conectar con Firebase. Revisa la conexión y los permisos.';
        console.error(error);
    });

    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeModal();
    });

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        })[char]);
    }

    function inlineArg(value) {
        return escapeHtml(JSON.stringify(String(value ?? '')));
    }

    function normalized(value, fallback = '') {
        const result = String(value ?? '').trim().toUpperCase();
        return result || fallback;
    }

    function sortedEntries(object) {
        return Object.entries(object || {}).sort(([, a], [, b]) =>
            naturalCollator.compare(String(a?.name || ''), String(b?.name || ''))
        );
    }

    function compareSizes(a, b) {
        const aSize = normalized(a, 'SIN TALLA');
        const bSize = normalized(b, 'SIN TALLA');
        const aRank = sizeRank.indexOf(aSize);
        const bRank = sizeRank.indexOf(bSize);
        if (aRank !== -1 || bRank !== -1) {
            if (aRank === -1) return 1;
            if (bRank === -1) return -1;
            return aRank - bRank;
        }
        return naturalCollator.compare(aSize, bSize);
    }

    function groupStockByColor(model) {
        const groups = new Map();
        Object.entries(model.stock || {}).forEach(([sid, variant]) => {
            if (!variant || typeof variant !== 'object') return;
            const color = normalized(variant.color, 'SIN COLOR');
            if (!groups.has(color)) groups.set(color, []);
            groups.get(color).push([sid, variant]);
        });
        return Array.from(groups.entries())
            .map(([color, variants]) => ({
                color,
                variants: variants.sort(([, a], [, b]) => compareSizes(a.size, b.size))
            }))
            .sort((a, b) => naturalCollator.compare(a.color, b.color));
    }

    function getColorHex(color) {
        const value = normalized(color);
        const colors = [
            ['AZUL MARINO', '#172554'], ['MARINO', '#172554'], ['NEGRO', '#111827'],
            ['BLANCO', '#ffffff'], ['ROJO', '#dc2626'], ['AZUL', '#2563eb'],
            ['VERDE', '#16a34a'], ['AMARILLO', '#facc15'], ['NARANJA', '#f97316'],
            ['ROSA', '#ec4899'], ['MORADO', '#9333ea'], ['VIOLETA', '#7c3aed'],
            ['GRIS', '#94a3b8'], ['MARRÓN', '#92400e'], ['MARRON', '#92400e'],
            ['BEIGE', '#d6c6a5'], ['BURDEOS', '#881337']
        ];
        return colors.find(([name]) => value.includes(name))?.[1] || '#cbd5e1';
    }

    function render() {
        const area = document.getElementById('content-area');
        area.innerHTML = '';
        if (currentTab === 'stock') renderStock();
        else if (currentTab === 'pending') renderOrders('toOrder');
        else renderOrders('ordered');
    }

    function renderStock() {
        const brands = appData.brands || {};
        const area = document.getElementById('content-area');
        colorCache = {};

        if (Object.keys(brands).length === 0) {
            area.innerHTML = `<div class="card p-12 md:p-16 text-center border-dashed">
                <i class="fas fa-box-open text-3xl text-slate-300 mb-4"></i>
                <p class="font-semibold text-slate-500">El catálogo está vacío.</p>
                <button onclick="showModal('brand')" class="btn-primary text-xs mt-4">Añadir primera marca</button>
            </div>`;
            return;
        }

        let result = '';
        sortedEntries(brands).forEach(([bid, brand]) => {
            const isBrandOpen = !!expanded.brands[bid];
            const brandPath = `brands/${bid}`;

            result += `<section class="card overflow-hidden mb-4">
                <div class="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center cursor-pointer hover:bg-slate-100 transition-colors" onclick="toggleExpand('brands', ${inlineArg(bid)})">
                    <div class="flex items-center gap-3 min-w-0">
                        <i class="fas fa-chevron-${isBrandOpen ? 'up' : 'down'} text-slate-400 text-xs transition-transform w-4"></i>
                        <h3 class="text-base font-bold text-slate-800 truncate">${escapeHtml(brand.name)}</h3>
                    </div>
                    <div class="flex gap-1 shrink-0">
                        <button onclick="event.stopPropagation(); editNameModal(${inlineArg(`${brandPath}/name`)}, ${inlineArg(brand.name)}, 'Renombrar Marca')" class="icon-btn text-slate-400 hover:text-blue-600 hover:bg-blue-50" title="Renombrar"><i class="fas fa-edit"></i></button>
                        <button onclick="event.stopPropagation(); del(${inlineArg(brandPath)}, ${inlineArg(`la marca ${brand.name}`)})" class="icon-btn text-slate-400 hover:text-red-500 hover:bg-red-50" title="Borrar"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;

            if (isBrandOpen) {
                result += `<div class="p-3 md:p-4 space-y-4">`;
                const categories = sortedEntries(brand.categories || {});
                if (!categories.length) {
                    result += `<div class="rounded-xl bg-slate-50 p-5 text-center text-sm text-slate-400">Esta marca todavía no tiene tipos de prenda.</div>`;
                }

                categories.forEach(([cid, category]) => {
                    const isCatOpen = !!expanded.cats[cid];
                    const categoryPath = `${brandPath}/categories/${cid}`;
                    result += `<div class="border border-slate-200 rounded-xl overflow-hidden">
                        <div class="p-3 bg-white flex justify-between items-center cursor-pointer hover:bg-slate-50 border-b border-slate-100" onclick="toggleExpand('cats', ${inlineArg(cid)})">
                            <div class="flex items-center gap-2 min-w-0">
                                <i class="fas fa-chevron-${isCatOpen ? 'up' : 'right'} text-slate-300 text-[10px] w-3"></i>
                                <span class="text-sm font-semibold text-slate-700 truncate">${escapeHtml(category.name)}</span>
                            </div>
                            <div class="flex gap-1 shrink-0">
                                <button onclick="event.stopPropagation(); editNameModal(${inlineArg(`${categoryPath}/name`)}, ${inlineArg(category.name)}, 'Renombrar Tipo')" class="icon-btn text-slate-300 hover:text-blue-600 hover:bg-blue-50" title="Renombrar"><i class="fas fa-edit text-xs"></i></button>
                                <button onclick="event.stopPropagation(); del(${inlineArg(categoryPath)}, ${inlineArg(`el tipo ${category.name}`)})" class="icon-btn text-slate-300 hover:text-red-500 hover:bg-red-50" title="Borrar"><i class="fas fa-trash text-xs"></i></button>
                            </div>
                        </div>`;

                    if (isCatOpen) {
                        result += `<div class="p-3 bg-slate-50/50 space-y-3">`;
                        const models = sortedEntries(category.models || {});
                        if (!models.length) {
                            result += `<div class="rounded-lg bg-white border border-dashed border-slate-200 p-4 text-center text-xs text-slate-400">Aún no hay modelos en este tipo.</div>`;
                        }

                        models.forEach(([mid, model]) => {
                            const isModelOpen = !!expanded.models[mid];
                            const modelPath = `${categoryPath}/models/${mid}`;
                            const groups = groupStockByColor(model);
                            const totalModel = groups.reduce((sum, group) =>
                                sum + group.variants.reduce((subtotal, [, variant]) => subtotal + (Number(variant.qty) || 0), 0), 0
                            );

                            result += `<div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
                                <div class="p-3 flex justify-between items-center cursor-pointer hover:bg-slate-50" onclick="toggleExpand('models', ${inlineArg(mid)})">
                                    <div class="flex items-center gap-2 min-w-0">
                                        <i class="fas fa-caret-${isModelOpen ? 'down' : 'right'} text-slate-400 text-xs w-3"></i>
                                        <span class="text-sm font-bold text-slate-800 truncate">${escapeHtml(model.name)}</span>
                                        <span class="hidden sm:inline-flex rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-bold text-slate-500">${groups.length} colores · ${totalModel} uds.</span>
                                    </div>
                                    <div class="flex gap-1 shrink-0">
                                        <button onclick="event.stopPropagation(); openVariantForModel(${inlineArg(bid)}, ${inlineArg(cid)}, ${inlineArg(mid)})" class="icon-btn text-slate-400 hover:text-emerald-600 hover:bg-emerald-50" title="Añadir color y tallas"><i class="fas fa-plus text-xs"></i></button>
                                        <button onclick="event.stopPropagation(); editNameModal(${inlineArg(`${modelPath}/name`)}, ${inlineArg(model.name)}, 'Renombrar Modelo')" class="icon-btn text-slate-300 hover:text-blue-600 hover:bg-blue-50" title="Renombrar"><i class="fas fa-edit text-xs"></i></button>
                                        <button onclick="event.stopPropagation(); del(${inlineArg(modelPath)}, ${inlineArg(`el modelo ${model.name}`)})" class="icon-btn text-slate-300 hover:text-red-500 hover:bg-red-50" title="Borrar"><i class="fas fa-trash text-xs"></i></button>
                                    </div>
                                </div>`;

                            if (isModelOpen) {
                                result += `<div class="border-t border-slate-100 bg-slate-50/70 p-2 md:p-3 space-y-2">`;
                                if (!groups.length) {
                                    result += `<div class="rounded-lg bg-white border border-dashed border-slate-200 p-6 text-center">
                                        <p class="text-xs font-semibold text-slate-400">Este modelo aún no tiene colores ni tallas.</p>
                                        <button onclick="openVariantForModel(${inlineArg(bid)}, ${inlineArg(cid)}, ${inlineArg(mid)})" class="mt-3 text-xs font-bold text-slate-700 hover:text-slate-950"><i class="fas fa-plus mr-1"></i>Añadir el primero</button>
                                    </div>`;
                                }

                                groups.forEach((group, groupIndex) => {
                                    const firstSid = group.variants[0]?.[0] || String(groupIndex);
                                    const colorId = `${mid}-${firstSid}`;
                                    const isColorOpen = expanded.colors[colorId] !== false;
                                    const totalColor = group.variants.reduce((sum, [, variant]) => sum + (Number(variant.qty) || 0), 0);
                                    const cacheId = `color-${mid}-${groupIndex}`;
                                    colorCache[cacheId] = {
                                        bid, cid, mid, color: group.color,
                                        pc: Number(group.variants[0]?.[1]?.pc) || 0,
                                        pv: Number(group.variants[0]?.[1]?.pv) || 0
                                    };

                                    result += `<div class="rounded-xl border border-slate-200 bg-white overflow-hidden">
                                        <div class="flex items-center justify-between gap-3 p-3 cursor-pointer hover:bg-slate-50" onclick="toggleExpand('colors', ${inlineArg(colorId)})">
                                            <div class="flex min-w-0 items-center gap-3">
                                                <i class="fas fa-chevron-${isColorOpen ? 'down' : 'right'} w-3 text-[10px] text-slate-400"></i>
                                                <span class="h-5 w-5 shrink-0 rounded-full border border-slate-300 shadow-inner" style="background:${getColorHex(group.color)}"></span>
                                                <div class="min-w-0">
                                                    <p class="truncate text-xs font-extrabold text-slate-800">${escapeHtml(group.color)}</p>
                                                    <p class="text-[10px] text-slate-400">${group.variants.length} tallas · ${totalColor} uds.</p>
                                                </div>
                                            </div>
                                            <button onclick="event.stopPropagation(); openColorBatch(${inlineArg(cacheId)})" class="shrink-0 rounded-lg bg-slate-100 px-3 py-1.5 text-[10px] font-bold text-slate-600 hover:bg-slate-200" title="Añadir tallas a este color">
                                                <i class="fas fa-plus mr-1"></i>Tallas
                                            </button>
                                        </div>`;

                                    if (isColorOpen) {
                                        result += `<div class="overflow-x-auto border-t border-slate-100">
                                            <table class="w-full text-left whitespace-nowrap">
                                                <thead class="bg-slate-50 text-[10px] uppercase text-slate-500 font-semibold border-b border-slate-100">
                                                    <tr>
                                                        <th class="py-2.5 px-4">Talla</th>
                                                        <th class="py-2.5 px-4 text-center">Stock</th>
                                                        <th class="py-2.5 px-4">P. Compra</th>
                                                        <th class="py-2.5 px-4">P. Venta</th>
                                                        <th class="py-2.5 px-4 text-right">Acción</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="text-xs divide-y divide-slate-100">`;

                                        group.variants.forEach(([sid, variant]) => {
                                            const qty = Number(variant.qty) || 0;
                                            const pc = Number(variant.pc) || 0;
                                            const pv = Number(variant.pv) || 0;
                                            const profit = (pv - pc).toFixed(2);
                                            result += `<tr class="hover:bg-slate-50/50">
                                                <td class="py-3 px-4 font-extrabold text-slate-700">${escapeHtml(normalized(variant.size, 'SIN TALLA'))}</td>
                                                <td class="py-3 px-4">
                                                    <div class="flex items-center justify-center gap-2 md:gap-3">
                                                        <button onclick="adjust(${inlineArg(bid)}, ${inlineArg(cid)}, ${inlineArg(mid)}, ${inlineArg(sid)}, -1)" class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200" aria-label="Restar una unidad">−</button>
                                                        <span class="font-bold text-sm w-6 text-center ${qty <= 2 ? 'text-red-600' : 'text-slate-800'}">${qty}</span>
                                                        <button onclick="adjust(${inlineArg(bid)}, ${inlineArg(cid)}, ${inlineArg(mid)}, ${inlineArg(sid)}, 1)" class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200" aria-label="Sumar una unidad">+</button>
                                                    </div>
                                                </td>
                                                <td class="py-3 px-4 text-slate-500">${pc.toFixed(2)}€</td>
                                                <td class="py-3 px-4">
                                                    <span class="font-semibold text-slate-800">${pv.toFixed(2)}€</span>
                                                    <span class="text-[9px] ${Number(profit) >= 0 ? 'text-green-600' : 'text-red-600'} block leading-none mt-0.5">Ben. ${profit}€</span>
                                                </td>
                                                <td class="py-3 px-4 text-right">
                                                    <button onclick="editVariantModal(${inlineArg(bid)}, ${inlineArg(cid)}, ${inlineArg(mid)}, ${inlineArg(sid)})" class="icon-btn text-slate-400 hover:text-blue-600 hover:bg-blue-50" title="Editar variante"><i class="fas fa-pencil-alt"></i></button>
                                                    <button onclick="addToOrderFromStock(${inlineArg(bid)}, ${inlineArg(cid)}, ${inlineArg(mid)}, ${inlineArg(sid)})" class="icon-btn text-slate-400 hover:text-amber-500 hover:bg-amber-50" title="Añadir a Por Pedir"><i class="fas fa-shopping-cart"></i></button>
                                                </td>
                                            </tr>`;
                                        });
                                        result += `</tbody></table></div>`;
                                    }
                                    result += `</div>`;
                                });
                                result += `</div>`;

                        });

        db.ref(`brands/${bid}/categories/${cid}/models/${mid}/stock/${sid}/qty`)
            .transaction(qty => Math.max(0, (Number(qty) || 0) + delta));

    function addToOrderFromStock(bid, cid, mid, sid) {
        const brand = appData.brands?.[bid];
        const model = brand?.categories?.[cid]?.models?.[mid];
        const variant = model?.stock?.[sid];
        if (!brand || !model || !variant) return;

        prepareModal('Añadir a Por Pedir');
        document.getElementById('modal-body').innerHTML = `
            <p class="text-sm text-slate-600">¿Cuántas unidades faltan de <b>${escapeHtml(model.name)} (${escapeHtml(variant.color)}/${escapeHtml(variant.size)})</b>?</p>
            <input id="add-order-qty" type="number" min="1" class="field" placeholder="Ej: 10" autofocus>

        document.getElementById('modal-btn').onclick = () => {
            const qty = parseInt(document.getElementById('add-order-qty').value);
            if (!qty || qty < 1) return setModalMessage('Escribe una cantidad mayor que cero.');
            db.ref('toOrder').push({
                brand: brand.name,
                model: model.name,
                variant: `${variant.color}/${variant.size}`,
                qty,
                pc: Number(variant.pc) || 0,
                ref: { bid, cid, mid, sid }
            });
            closeModal();
            switchTab('pending');

    function moveOrder(id) {
        const order = appData.toOrder?.[id];
        if (!order) return;
        const updates = {};
        updates[`ordered/${id}`] = order;
        updates[`toOrder/${id}`] = null;
        db.ref('/').update(updates);
    }

    function receiveOrder(id) {
        const order = appData.ordered?.[id];
        if (!order) return;

        if (order.ref?.bid) {
            const qtyRef = db.ref(`brands/${order.ref.bid}/categories/${order.ref.cid}/models/${order.ref.mid}/stock/${order.ref.sid}/qty`);
            qtyRef.transaction(qty => (Number(qty) || 0) + (Number(order.qty) || 0))
                .then(() => db.ref(`ordered/${id}`).remove());
        } else {
            db.ref(`ordered/${id}`).remove();
        }
    }

    function getSelectedModel() {
        const bid = document.getElementById('sb')?.value;
        const cid = document.getElementById('sc')?.value;
        const mid = document.getElementById('sm')?.value;
        return {
            bid, cid, mid,
            model: appData.brands?.[bid]?.categories?.[cid]?.models?.[mid]
        };
    }

    function findExistingVariant(size) {
        const { model } = getSelectedModel();
        const color = normalized(document.getElementById('fc')?.value);
        const targetSize = normalized(size);
        if (!model || !color || !targetSize) return null;
        return Object.entries(model.stock || {}).find(([, variant]) =>
            normalized(variant.color) === color && normalized(variant.size) === targetSize
        ) || null;
    }

    function togglePresetSize(size) {
        if (findExistingVariant(size)) return;
        const existingDraft = variantDraftSizes.find(item => item.size === size);
        if (existingDraft) {
            variantDraftSizes = variantDraftSizes.filter(item => item.id !== existingDraft.id);
        } else {
            variantDraftSizes.push({ id: `draft-${++variantDraftSequence}`, size, qty: 0 });
        }
        renderSizeEditor();
    }

    function addCustomSizes() {
        const input = document.getElementById('custom-sizes');
        const sizes = String(input.value || '')
            .split(/[,;\n]+/)
            .map(size => normalized(size))
            .filter(Boolean);
        if (!sizes.length) return setModalMessage('Escribe al menos una talla.');

        const duplicates = [];
        sizes.forEach(size => {
            if (findExistingVariant(size)) {
                duplicates.push(size);
                return;
            }
            if (!variantDraftSizes.some(item => item.size === size)) {
                variantDraftSizes.push({ id: `draft-${++variantDraftSequence}`, size, qty: 0 });
            }
        });
        input.value = '';
        if (duplicates.length) setModalMessage(`Ya existen y no se duplicarán: ${duplicates.join(', ')}`, 'error');
        renderSizeEditor();
    }

    function removeSizeRow(id) {
        variantDraftSizes = variantDraftSizes.filter(item => item.id !== id);
        renderSizeEditor();
    }

    function updateDraftQty(id, value) {
        const item = variantDraftSizes.find(draft => draft.id === id);
        if (item) item.qty = Math.max(0, parseInt(value) || 0);
    }

    function renderSizeEditor() {
        const chips = document.getElementById('size-chips');
        const rows = document.getElementById('size-rows');
        if (!chips || !rows) return;

        chips.innerHTML = commonSizes.map(size => {
            const selected = variantDraftSizes.some(item => item.size === size);
            const existing = !!findExistingVariant(size);
            const className = existing ? 'size-chip size-chip-existing' : selected ? 'size-chip size-chip-selected' : 'size-chip';
            return `<button type="button" class="${className}" onclick="togglePresetSize(${inlineArg(size)})" ${existing ? 'disabled title="Esta talla ya existe"' : ''}>${escapeHtml(size)}${existing ? ' ✓' : ''}</button>`;
        }).join('');

        if (!variantDraftSizes.length) {
            rows.innerHTML = `<div class="rounded-xl border border-dashed border-slate-200 p-5 text-center text-xs text-slate-400">Selecciona las tallas de arriba o añade otras.</div>`;
            return;
        }

        rows.innerHTML = [...variantDraftSizes]
            .sort((a, b) => compareSizes(a.size, b.size))
            .map(item => `<div class="grid grid-cols-[1fr_7rem_2rem] items-center gap-2 rounded-xl bg-slate-50 p-2">
                <div class="min-w-0">
                    <span class="text-[10px] font-bold uppercase text-slate-400">Talla</span>
                    <p class="truncate text-sm font-extrabold text-slate-800">${escapeHtml(item.size)}</p>
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase text-slate-400">Unidades</label>
                    <input type="number" min="0" value="${item.qty}" oninput="updateDraftQty(${inlineArg(item.id)}, this.value)" class="field !p-2 text-center">
                </div>
                <button type="button" onclick="removeSizeRow(${inlineArg(item.id)})" class="icon-btn text-slate-300 hover:text-red-500 hover:bg-red-50" title="Quitar talla"><i class="fas fa-times"></i></button>
            </div>`).join('');
    }

    function saveVariantBatch() {
        const { bid, cid, mid, model } = getSelectedModel();
        const color = normalized(document.getElementById('fc')?.value);
        const pc = Math.max(0, parseFloat(document.getElementById('fpc')?.value) || 0);
        const pv = Math.max(0, parseFloat(document.getElementById('fpv')?.value) || 0);

        if (!bid || !cid || !mid || !model) return setModalMessage('Selecciona marca, tipo y modelo.');
        if (!color) return setModalMessage('Escribe el color.');
        if (!variantDraftSizes.length) return setModalMessage('Selecciona al menos una talla.');

        const root = db.ref(`brands/${bid}/categories/${cid}/models/${mid}/stock`);
        const updates = {};
        const duplicates = [];

        variantDraftSizes.forEach(item => {
            if (findExistingVariant(item.size)) {
                duplicates.push(item.size);
                return;
            }
            const sid = root.push().key;
            updates[sid] = {
                color,
                size: item.size,
                qty: Math.max(0, Number(item.qty) || 0),
                pc,
                pv
            };
        });

        if (!Object.keys(updates).length) {
            return setModalMessage(`Estas tallas ya existen para ${color}: ${duplicates.join(', ')}`);
        }

        const button = document.getElementById('modal-btn');
        button.disabled = true;
        button.innerText = 'Guardando...';
        root.update(updates).then(() => {
            expanded.brands[bid] = true;
            expanded.cats[cid] = true;
            expanded.models[mid] = true;
            const saved = Object.keys(updates).length;
            closeModal();
            showToast(`${saved} talla${saved === 1 ? '' : 's'} añadida${saved === 1 ? '' : 's'} a ${color}.${duplicates.length ? ` ${duplicates.length} ya existían.` : ''}`);
        }).catch(error => {
            console.error(error);
            button.disabled = false;
            button.innerText = 'Guardar tallas';
            setModalMessage('No se pudo guardar. Revisa la conexión y vuelve a intentarlo.');
        });
    }

    function brandSelect(selected = '') {
        let html = `<select id="sb" class="field text-sm text-slate-600"><option value="">-- Selecciona Marca --</option>`;
        sortedEntries(appData.brands || {}).forEach(([id, brand]) => {
            html += `<option value="${escapeHtml(id)}" ${id === selected ? 'selected' : ''}>${escapeHtml(brand.name)}</option>`;
        });
        return html + `</select>`;
    }

    function loadCategories(bid, includeModels = false, selectedCategory = '', selectedModel = '') {
        const categoryContainer = document.getElementById('scat');
        const modelContainer = document.getElementById('smod');
        if (!categoryContainer) return;

        if (!bid || !appData.brands?.[bid]) {
            categoryContainer.innerHTML = '';
            if (modelContainer) modelContainer.innerHTML = '';
            return;
        }

        let html = `<select id="sc" class="field text-sm text-slate-600"><option value="">-- Selecciona Tipo --</option>`;
        sortedEntries(appData.brands[bid].categories || {}).forEach(([id, category]) => {
            html += `<option value="${escapeHtml(id)}" ${id === selectedCategory ? 'selected' : ''}>${escapeHtml(category.name)}</option>`;
        });
        categoryContainer.innerHTML = html + `</select>`;
        document.getElementById('sc').onchange = event => {
            if (includeModels) loadModels(bid, event.target.value);
            renderSizeEditor();
        };
        if (includeModels && selectedCategory) loadModels(bid, selectedCategory, selectedModel);
    }

    function loadModels(bid, cid, selectedModel = '') {
        const container = document.getElementById('smod');
        if (!container) return;
        if (!cid || !appData.brands?.[bid]?.categories?.[cid]) {
            container.innerHTML = '';
            return;
        }

        let html = `<select id="sm" class="field text-sm text-slate-600"><option value="">-- Selecciona Modelo --</option>`;
        sortedEntries(appData.brands[bid].categories[cid].models || {}).forEach(([id, model]) => {
            html += `<option value="${escapeHtml(id)}" ${id === selectedModel ? 'selected' : ''}>${escapeHtml(model.name)}</option>`;
        });
        container.innerHTML = html + `</select>`;
        document.getElementById('sm').onchange = renderSizeEditor;
        renderSizeEditor();
    }

    function downloadBackup() {
        const date = new Date().toISOString().slice(0, 10);
        const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `imprecan-backup-${date}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        showToast('Copia de seguridad descargada.');
    }

    function updateStats() {
        let total = 0;
        let low = 0;
        let investment = 0;
        let profit = 0;

        Object.values(appData.brands || {}).forEach(brand => {
            Object.values(brand.categories || {}).forEach(category => {
                Object.values(category.models || {}).forEach(model => {
                    Object.values(model.stock || {}).forEach(variant => {
                        if (!variant || typeof variant !== 'object') return;
                        const qty = Number(variant.qty) || 0;
                        const pc = Number(variant.pc) || 0;
                        const pv = Number(variant.pv) || 0;
                        total += qty;
                        investment += qty * pc;
                        profit += qty * (pv - pc);
                        if (qty <= 2) low++;
                    });
                });
            });
        });

        document.getElementById('stat-total').innerText = total;
        document.getElementById('stat-low').innerText = low;
        document.getElementById('stat-investment').innerText = investment.toFixed(2) + '€';
        document.getElementById('stat-profit').innerText = profit.toFixed(2) + '€';
    }
</script>
</body>
